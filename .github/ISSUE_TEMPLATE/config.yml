# Blank issues stay enabled: this is a small project and a plain question is
# often the right shape. The links below exist to keep the one category that
# must NOT become a public issue out of the public tracker.
blank_issues_enabled: true

contact_links:
  - name: 🔒 Report a security vulnerability
    url: https://github.com/schbz/schl8/security/advisories/new
    about: >
      Please do not open a public issue for anything that could leak plaintext
      or key material. Use a private advisory — see SECURITY.md for what is in
      and out of scope.

  - name: 📖 Documentation
    url: https://github.com/schbz/schl8#readme
    about: >
      Features, configuration reference, keyboard shortcuts, and the security
      model are all in the README before you file.

  - name: 🛠 Contributing
    url: https://github.com/schbz/schl8/blob/master/CONTRIBUTING.md
    about: >
      Build and test instructions, and the security invariants a change must
      preserve.
