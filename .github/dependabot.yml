version: 2

# Schl8 depends on cryptography crates and a GUI stack, and CI already fails
# on any new RUSTSEC advisory via cargo-deny. Dependabot is the other half of
# that: cargo-deny tells you a dependency became dangerous, this opens the PR
# that fixes it.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # egui/eframe move together and are only useful upgraded as a set;
      # separate PRs for them would never build.
      egui:
        patterns:
          - "egui*"
          - "eframe"
      # Everything else, batched by semver impact so a routine week is one
      # PR rather than five. Breaking bumps stay separate — those need
      # reading, especially in the crypto crates.
      patch-and-minor:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "egui*"
          - "eframe"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
